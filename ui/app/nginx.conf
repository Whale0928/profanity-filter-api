server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 앱이 아는 경로만 SPA 진입점을 200으로 준다. 나머지는 같은 화면을 404로 내려
  # 검색엔진이 없는 경로를 중복 페이지(soft 404)로 색인하지 않게 한다.
  error_page 404 /index.html;

  location = /docs {
    try_files /docs/index.html =404;
  }

  location = /docs/ {
    return 308 /docs;
  }

  location ~ ^/(news|login|privacy|terms|admin|app(/.*)?)$ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location = /health {
    access_log off;
    return 200 "OK\n";
  }
}
