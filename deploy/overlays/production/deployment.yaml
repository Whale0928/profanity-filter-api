apiVersion: apps/v1
kind: Deployment
metadata:
  name: profanity-api
  namespace: profanity-production
  labels:
    app: profanity-api
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: profanity-api
  template:
    metadata:
      labels:
        app: profanity-api
        environment: production
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: zot-registry-secret
      containers:
        - name: profanity-api
          image: docker-registry.bottle-note.com/profanity-api
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # JDBC URL이 serverTimezone=Asia/Seoul이라 드라이버는 LocalDateTime을 JVM 시간대에서
            # 서비스 시간대로 변환해 보낸다. JVM이 UTC이면 이미 KST로 만든 시각에 9시간이 더 얹히므로
            # JVM 시간대를 서비스 시간대에 맞춰 고정해 변환량을 0으로 만든다.
            - name: TZ
              value: "Asia/Seoul"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Seoul"
          envFrom:
            - secretRef:
                name: profanity-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "4"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
